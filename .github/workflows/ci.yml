name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - 'dev/**'

jobs:
  test:
    name: Test (mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.0"  # 固定版本，避免意外的 breaking changes

      # 缓存 Mypy 和 uv 缓存,加速检查
      - name: Cache Mypy and uv
        uses: actions/cache@v4
        with:
          path: |
            .mypy_cache
            ~/.cache/uv
          key: test-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          # 增加回退 key，少重新构建
          restore-keys: |
            test-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-
            test-${{ runner.os }}-

      # 动态生成锁文件，避免需要列出所有隐式依赖给 uv
      - name: Generate lockfile (compile)
        run: |
          uv pip compile requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -o requirements.lock

      # 用 uv 创建虚拟环境并同步依赖（替代 pip install）
      - name: Create venv & sync deps (uv)
        run: |
          uv venv .venv -p 3.12
          source .venv/bin/activate
          uv pip sync requirements.lock

      - name: Install package in editable mode
        run: |
          source .venv/bin/activate
          uv pip install -e .

      - name: Run mypy
        run: |
          source .venv/bin/activate
          mypy .

      - name: Run pytest
        run: |
          source .venv/bin/activate
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest .
