name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - 'dev/**'

jobs:
  test:
    name: Test (mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.0"  # 固定版本，避免意外的 breaking changes
          enable-cache: true  # 启用内置缓存功能
          cache-dependency-glob: "requirements.txt"  # 使用 requirements.txt 作为缓存键

      # 缓存 Mypy
      - name: Cache Mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-
            mypy-${{ runner.os }}-

      # 动态生成锁文件，避免需要列出所有隐式依赖给 uv
      - name: Generate lockfile (compile)
        run: |
          uv pip compile requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -o requirements.lock

      # 用 uv 创建虚拟环境并同步依赖（替代 pip install）
      - name: Create venv & sync deps (uv)
        run: |
          uv venv .venv -p 3.12
          source .venv/bin/activate
          uv pip sync requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu

      # 安装当前包（如果有），以便 mypy 和 pytest 能正确识别模块
      - name: Install package in editable mode
        run: |
          source .venv/bin/activate
          uv pip install -e .

      - name: Run mypy
        run: |
          source .venv/bin/activate
          mypy .

      - name: Run pytest
        run: |
          source .venv/bin/activate
          pytest .
